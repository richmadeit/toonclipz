# This adds the chip store without changing existing ToonClipz pages or scripts.
[build]
  base = "."
  command = "node scripts/build-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Directory routing serves /rich-buys-iphone/. Do not force a trailing-slash
# redirect: Netlify normalizes slashes before redirect matching.
[[redirects]]
  from = "/iphone-chips/*"
  to = "/rich-buys-iphone/:splat"
  status = 301

[[headers]]
  for = "/rich-buys-iphone/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/rich-buys-iphone/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/rich-buys-iphone/track.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/rich-buys-iphone/buyer-bonus-pack.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
