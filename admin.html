<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToonClipz Admin</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#151515; --border:#2a2a2a;
    --toon:#00c2ff; --gold:#ffb300; --text:#efefef; --faint:#888;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    padding:20px;
  }
  h1{
    font-size:1.3rem; margin:0 0 4px;
  }
  .sub{ color:var(--faint); font-size:0.85rem; margin-bottom:18px; }
  .toolbar{
    display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;
  }
  .toolbar button{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:0.85rem; cursor:pointer;
  }
  .toolbar button.active{ border-color:var(--toon); color:var(--toon); }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:14px;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; opacity:1; transition:opacity .15s;
  }
  .card.done{ opacity:0.35; }
  .card img{
    width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer;
    background:#000;
  }
  .card .info{ padding:10px 12px; }
  .card .handle{ font-weight:700; font-size:0.92rem; }
  .card .meta{ color:var(--faint); font-size:0.72rem; margin-top:3px; }
  .card .row{ display:flex; gap:8px; margin-top:10px; }
  .card .row a, .card .row button{
    flex:1; text-align:center; padding:7px 0; border-radius:7px; font-size:0.78rem;
    text-decoration:none; border:1px solid var(--border); cursor:pointer;
  }
  .card .open{ color:var(--toon); background:rgba(0,194,255,0.08); }
  .card .done-btn{ color:var(--gold); background:rgba(255,179,0,0.08); }
  .empty{ color:var(--faint); text-align:center; padding:60px 0; }
  .gate{
    max-width:320px; margin:80px auto; text-align:center;
  }
  .gate input{
    width:100%; padding:12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-size:1rem; margin-top:14px;
    text-align:center;
  }
  .gate button{
    margin-top:12px; width:100%; padding:12px; border-radius:8px; border:none;
    background:var(--toon); color:#000; font-weight:700; font-size:1rem; cursor:pointer;
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>ToonClipz Admin</h1>
  <div class="sub">Enter your admin code</div>
  <input type="password" id="codeInput" placeholder="code">
  <button onclick="checkCode()">Enter</button>
</div>

<div id="main" style="display:none;">
  <h1>ToonClipz Admin</h1>
  <div class="sub" id="countSub">Loading…</div>
  <div class="toolbar">
    <button id="filterPending" class="active" onclick="setFilter('pending')">Pending</button>
    <button id="filterAll" onclick="setFilter('all')">All</button>
    <button onclick="loadSubmissions()">Refresh</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pamizjfazcuofekzjekm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhbWl6amZhemN1b2Zla3pqZWttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjU1NTksImV4cCI6MjA5MjA0MTU1OX0.WY1FxdaZfr5g8HcUpNRWHjgT8FsDEI6IQF8ilTqlr9Y';
const ADMIN_CODE = 'rich'; // change this to match index.html if you change it there

let supa = null;
if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
  supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let filter = 'pending';
let pollTimer = null;

function checkCode(){
  const val = document.getElementById('codeInput').value;
  if (val !== ADMIN_CODE) { alert('Nope.'); return; }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  loadSubmissions();
  pollTimer = setInterval(loadSubmissions, 10000);
}

function setFilter(f){
  filter = f;
  document.getElementById('filterPending').classList.toggle('active', f === 'pending');
  document.getElementById('filterAll').classList.toggle('active', f === 'all');
  loadSubmissions();
}

async function loadSubmissions(){
  const grid = document.getElementById('grid');
  const countSub = document.getElementById('countSub');
  if (!supa) {
    grid.innerHTML = '<div class="empty">Supabase not connected — check SUPABASE_URL / SUPABASE_ANON_KEY at the top of this file.</div>';
    return;
  }
  try {
    let query = supa.from('submissions').select('*').order('created_at', { ascending: false });
    if (filter === 'pending') query = query.eq('done', false);
    const { data, error } = await query;
    if (error) throw error;

    if (!data || data.length === 0) {
      countSub.textContent = filter === 'pending' ? 'No pending submissions' : 'No submissions yet';
      grid.innerHTML = '<div class="empty">Nothing here yet.</div>';
      return;
    }

    countSub.textContent = data.length + (filter === 'pending' ? ' pending' : ' total');

    grid.innerHTML = '';
    data.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card' + (d.done ? ' done' : '');
      const label = (d.handle && d.handle.trim()) ? d.handle : (d.name || 'Someone');
      card.innerHTML = `
        <img src="${d.image_url}" onclick="window.open('${d.image_url}', '_blank')">
        <div class="info">
          <div class="handle">${label}</div>
          <div class="meta">${d.platform || ''} ${d.code ? '· code ' + d.code : ''} · ${new Date(d.created_at).toLocaleTimeString()}</div>
          <div class="row">
            <a class="open" href="${d.image_url}" target="_blank">Open full size</a>
            <button class="done-btn" onclick="markDone('${d.id}', ${!d.done})">${d.done ? 'Undo' : 'Done'}</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<div class="empty">Couldn\u2019t load submissions.</div>';
  }
}

async function markDone(id, doneVal){
  try {
    await supa.from('submissions').update({ done: doneVal }).eq('id', id);
    loadSubmissions();
  } catch (e) { console.error(e); }
}

document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkCode();
});
</script>
</body>
</html>
